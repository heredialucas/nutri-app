server {
    server_name nutricion.mauroacosta.com;
    return 301 https://mauroacosta.com$request_uri;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/nutricion.mauroacosta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nutricion.mauroacosta.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name nutricion.mauroacosta.com;
    return 301 https://mauroacosta.com$request_uri;
}
